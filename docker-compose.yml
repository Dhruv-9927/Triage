version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sehat_postgres
    environment:
      POSTGRES_DB: sehat_db
      POSTGRES_USER: sehat_user
      POSTGRES_PASSWORD: sehat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehat_user -d sehat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sehat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
